<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef2ff,#fdf2f8);display:flex;justify-content:center;align-items:center;color:#222}
.app{width:420px;background:white;border-radius:24px;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
h1{text-align:center;margin-top:0}
.input{display:flex;gap:10px}
input{flex:1;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
button{border:0;background:#6366f1;color:white;border-radius:12px;padding:12px 18px;cursor:pointer}
ul{padding:0;list-style:none;margin-top:25px}
li{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;padding:12px;margin-bottom:10px;border-radius:12px}
.done span{text-decoration:line-through;color:#999}
.delete{background:#ef4444;padding:8px 12px}
.info{text-align:center;color:#666;margin-top:15px}
</style>
</head>
<body>
<div class="app">
<h1>✅ Todo List</h1>
<div class="input">
<input id="task" placeholder="输入任务...">
<button onclick="addTask()">添加</button>
</div>
<ul id="list"></ul>
<div class="info" id="count"></div>
</div>
<script>
let tasks=JSON.parse(localStorage.getItem('tasks')||'[]');
function save(){localStorage.setItem('tasks',JSON.stringify(tasks));render()}
function addTask(){let v=document.getElementById('task').value.trim();if(!v)return;tasks.push({text:v,done:false});document.getElementById('task').value='';save()}
function toggle(i){tasks[i].done=!tasks[i].done;save()}
function removeTask(i){tasks.splice(i,1);save()}
function render(){let ul=document.getElementById('list');ul.innerHTML='';tasks.forEach((t,i)=>{let li=document.createElement('li');if(t.done)li.className='done';li.innerHTML=`<span onclick="toggle(${i})">${t.text}</span><button class="delete" onclick="removeTask(${i})">删除</button>`;ul.appendChild(li)});document.getElementById('count').innerText=`共 ${tasks.length} 项，完成 ${tasks.filter(t=>t.done).length} 项`}
render();
</script>
</body>
</html>
