<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef2ff,#fdf2f8);display:flex;justify-content:center;align-items:center;color:#222}
.app{width:min(520px,calc(100vw - 32px));background:white;border-radius:24px;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
h1{text-align:center;margin-top:0}
.input{display:grid;grid-template-columns:1fr 160px auto;gap:10px}
input{flex:1;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
button{border:0;background:#6366f1;color:white;border-radius:12px;padding:12px 18px;cursor:pointer}
ul{padding:0;list-style:none;margin-top:25px}
li{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f8fafc;padding:12px;margin-bottom:10px;border-radius:12px}
.task-content{min-width:0}
.task-text{display:block;overflow-wrap:anywhere;cursor:pointer}
.done .task-text{text-decoration:line-through;color:#999}
.due-date{display:inline-block;margin-top:6px;color:#64748b;font-size:13px}
.due-date.due-today{color:#d97706}
.due-date.overdue{color:#dc2626;font-weight:600}
.delete{background:#ef4444;padding:8px 12px}
.info{text-align:center;color:#666;margin-top:15px}
@media (max-width:560px){.input{grid-template-columns:1fr}.input button{width:100%}}
</style>
</head>
<body>
<div class="app">
<h1>✅ Todo List</h1>
<div class="input">
<input id="task" placeholder="输入任务...">
<input id="dueDate" type="date" aria-label="截止日期">
<button onclick="addTask()">添加</button>
</div>
<ul id="list"></ul>
<div class="info" id="count"></div>
</div>
<script>
let tasks=JSON.parse(localStorage.getItem('tasks')||'[]').map(task=>({dueDate:'',...task}));
function save(){localStorage.setItem('tasks',JSON.stringify(tasks));render()}
function addTask(){let v=document.getElementById('task').value.trim();let dueDate=document.getElementById('dueDate').value;if(!v)return;tasks.push({text:v,done:false,dueDate});document.getElementById('task').value='';document.getElementById('dueDate').value='';save()}
function toggle(i){tasks[i].done=!tasks[i].done;save()}
function removeTask(i){tasks.splice(i,1);save()}
function escapeHTML(value){return value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function todayString(){let now=new Date();let month=String(now.getMonth()+1).padStart(2,'0');let day=String(now.getDate()).padStart(2,'0');return `${now.getFullYear()}-${month}-${day}`}
function dueDateClass(dueDate){if(!dueDate)return'';let today=todayString();if(dueDate<today)return' overdue';if(dueDate===today)return' due-today';return''}
function dueDateLabel(dueDate){if(!dueDate)return'';let isOverdue=dueDateClass(dueDate).includes('overdue');return `<small class="due-date${dueDateClass(dueDate)}">截止：${dueDate}${isOverdue?'（已过期）':''}</small>`}
function render(){let ul=document.getElementById('list');ul.innerHTML='';tasks.forEach((t,i)=>{let li=document.createElement('li');if(t.done)li.className='done';li.innerHTML=`<div class="task-content"><span class="task-text" onclick="toggle(${i})">${escapeHTML(t.text)}</span>${dueDateLabel(t.dueDate)}</div><button class="delete" onclick="removeTask(${i})">删除</button>`;ul.appendChild(li)});document.getElementById('count').innerText=`共 ${tasks.length} 项，完成 ${tasks.filter(t=>t.done).length} 项`}
render();
</script>
</body>
</html>
